name: CI
on:
    push:
        branches: [main, dev]
    pull_request:
        branches: [main, dev]
jobs:
    test-and-build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm
            - run: npm ci
            - run: npm run test:run
            - run: npm run build
              env:
                  GEMINI_API_KEY: dummy-key-for-ci-build
